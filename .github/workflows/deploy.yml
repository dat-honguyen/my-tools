name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Space-separated list of MFE projects to build and publish.
      # Add a new project name here as more remotes are added to the workspace.
      PROJECTS: devkit coming-soon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build each remote under its own subpath
        run: |
          mkdir -p public
          for project in $PROJECTS; do
            npx nx build "$project"
            # Angular-style builds (e.g. coming-soon) write to
            # dist/$project/browser at the repo root. esbuild-style builds
            # (e.g. devkit) run from apps/$project with their own
            # `outputPath: 'dist/devkit'`, landing at
            # apps/$project/dist/$project instead — see
            # apps/devkit/build/build.ts and apps/devkit/project.json.
            if [ -d "dist/$project/browser" ]; then
              cp -r "dist/$project/browser" "public/$project"
            elif [ -d "dist/$project" ]; then
              cp -r "dist/$project" "public/$project"
            elif [ -d "apps/$project/dist/$project" ]; then
              cp -r "apps/$project/dist/$project" "public/$project"
            else
              echo "::error::Could not find build output for $project"
              exit 1
            fi
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
